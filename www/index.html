<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeakUp</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ff;--card:#fff;--tx:#1d1b2e;--mut:#6b6880;--ac:#6c4cf1;--ac2:#ece8ff;--bd:#e3dff5;--tip:#fff6e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--card:#1f1c30;--tx:#f0eeff;--mut:#a29fb8;--ac:#9b83ff;--ac2:#2c2748;--bd:#332e4d;--tip:#3a3220}}
:root[data-theme="dark"]{--bg:#14121f;--card:#1f1c30;--tx:#f0eeff;--mut:#a29fb8;--ac:#9b83ff;--ac2:#2c2748;--bd:#332e4d;--tip:#3a3220}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
label{font-size:13px;color:var(--mut);display:block;margin:8px 0 4px}
.av{display:flex;gap:8px;flex-wrap:wrap}
.av button{flex:1;min-width:100px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:10px;cursor:pointer;font:inherit}
.av button.on{border-color:var(--ac);background:var(--ac2)}.av .e{font-size:30px;display:block}.av small{color:var(--mut)}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>div{flex:1}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:600 16px inherit;cursor:pointer}
#chat{display:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.face{width:96px;height:96px;flex:none;border-radius:50%;background:var(--ac2);overflow:hidden;border:3px solid var(--bd)}
.face svg{width:100%;height:100%;display:block;animation:br 4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes br{50%{transform:translateY(-1.5px) scale(1.02)}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4.2s infinite}
@keyframes bl{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.35)}
.face.talk .mouth{animation:mt .26s ease-in-out infinite alternate}
@keyframes mt{from{transform:scaleY(.3) scaleX(.9)}to{transform:scaleY(1.7) scaleX(1.05)}}
.head{transform-box:fill-box;transform-origin:50% 100%}
.face.talk .head{animation:nod 1.1s ease-in-out infinite}
@keyframes nod{50%{transform:rotate(1.6deg)}}
.top b{display:block}.top span{font-size:13px;color:var(--mut)}
.top button{margin-inline-start:auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 10px;cursor:pointer}
#log{height:min(52vh,460px);overflow-y:auto;padding:4px}
.m{max-width:85%;padding:10px 13px;border-radius:16px;margin:8px 0;white-space:pre-wrap}
.a{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.u{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.tip{background:var(--tip);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px;direction:rtl;text-align:right}
.in{display:flex;gap:8px;margin-top:8px}
.in input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;min-width:0}
.in button{border:0;border-radius:12px;padding:0 14px;background:var(--ac);color:#fff;font-size:18px;cursor:pointer}
.in button.mic.rec{background:#e5484d}.in button:disabled{opacity:.5}
input.t{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
</style></head><body><div class="wrap">
<h1>🗣️ SpeakUp <button id="cfg" style="float:right;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:4px 10px">⚙️</button></h1><p class="sub">AI conversation partner • تمرین مکالمه با هوش مصنوعی</p>

<div id="setup"><div class="card" id="cfgc" style="display:none"><label>Gemini API key</label><input class="t" id="key" type="password" autocomplete="off"><label>Model</label><input class="t" id="mdl"><button class="go" id="sv">Save</button></div>
 <div class="card"><label>Choose your partner / مربی خودت رو انتخاب کن</label><div class="av" id="avs"></div>
 <div class="row"><div><label>Language</label><select id="lang"></select></div><div><label>Level</label><select id="lvl"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option></select></div></div>
 <label>Topic / موضوع</label><select id="topic"></select>
 <button class="go" id="start">Start conversation ▶</button></div>
</div>

<div id="chat">
 <div class="top"><div class="face" id="face"></div><div><b id="nm"></b><span id="ds"></span></div><button id="end">End ✕</button></div>
 <div class="card"><div id="log"></div>
 <div class="in"><button class="mic" id="mic" title="Speak">🎤</button><input id="txt" placeholder="Type or tap the mic…" autocomplete="off"><button id="snd">➤</button></div>
 <div class="note" id="note"></div></div>
</div>
</div>
<script>
const AV=[{id:"alisha",n:"Alisha",sk:"#f1c9a5",hr:"#6b3b1e",sh:"#6c4cf1",lg:1,e:"👩🏼‍🏫",d:"Friendly teacher, USA",acc:"en-US",p:"Alisha is a warm, encouraging American teacher."},
{id:"charlie",n:"Charlie",sk:"#f6d5bd",hr:"#d98a2b",sh:"#e5484d",lg:0,e:"🧑🏻‍🎤",d:"Witty, British",acc:"en-GB",p:"Charlie is a quick-witted British culture lover; light British slang, but easy to follow."},
{id:"marco",n:"Marco",sk:"#c58c64",hr:"#1e1a17",sh:"#2f6fdb",lg:0,e:"👨🏽‍💼",d:"News editor, professional",acc:"en-US",p:"Marco is a professional American news editor; polite, clear, asks sharp follow-up questions."}];
const LANGS={English:"en",Spanish:"es",French:"fr",German:"de",Italian:"it",Japanese:"ja"};
const TOPICS=["Free conversation","Daily life","Travel & airport","Ordering at a restaurant","Job interview","IT help desk role-play","IELTS Speaking practice","Movies & music","Technology","Talk about my day"];
let S={av:AV[0],hist:[],busy:false},sample=null,rec=null,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const $=id=>document.getElementById(id);
try{const s=JSON.parse(localStorage.getItem("su")||"{}");S.saved=s}catch(e){S.saved={}}
AV.forEach((a,i)=>{const b=document.createElement("button");b.innerHTML=`<span class="e">${a.e}</span><b>${a.n}</b><br><small>${a.d}</small>`;b.onclick=()=>{S.av=a;[...$("avs").children].forEach(x=>x.classList.remove("on"));b.classList.add("on")};if(i==0)b.classList.add("on");$("avs").append(b)});
Object.keys(LANGS).forEach(l=>$("lang").add(new Option(l)));TOPICS.forEach(t=>$("topic").add(new Option(t)));
if(S.saved.l)$("lang").value=S.saved.l;if(S.saved.v)$("lvl").value=S.saved.v;
function avatarSVG(a){return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M14 100Q16 76 50 74Q84 76 86 100Z" fill="${a.sh}"/><g class="head">${a.lg?`<ellipse cx="50" cy="54" rx="28" ry="36" fill="${a.hr}"/>`:""}<rect x="43" y="64" width="14" height="14" rx="5" fill="${a.sk}"/><ellipse cx="50" cy="48" rx="22" ry="26" fill="${a.sk}"/><ellipse cx="28.5" cy="50" rx="3" ry="5" fill="${a.sk}"/><ellipse cx="71.5" cy="50" rx="3" ry="5" fill="${a.sk}"/><path d="M26 48Q24 18 50 19Q76 18 74 48Q70 31 52 30Q42 36 30 34Q27 40 26 48Z" fill="${a.hr}"/><g class="eye"><ellipse cx="41" cy="47" rx="2.7" ry="3.3" fill="#1d1b2e"/><ellipse cx="59" cy="47" rx="2.7" ry="3.3" fill="#1d1b2e"/></g><path d="M36 41Q41 38 46 41M54 41Q59 38 64 41" stroke="${a.hr}" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M50 50Q47 56 51 56" stroke="#0003" stroke-width="1.2" fill="none" stroke-linecap="round"/><ellipse cx="36" cy="56" rx="4" ry="2.4" fill="#ff8a8a" opacity=".3"/><ellipse cx="64" cy="56" rx="4" ry="2.4" fill="#ff8a8a" opacity=".3"/><ellipse class="mouth" cx="50" cy="62" rx="6" ry="3" fill="#8b2d3a"/></g></svg>`}
function add(role,text){const d=document.createElement("div");d.className="m "+(role=="u"?"u":"a");d.textContent=text;$("log").append(d);$("log").scrollTop=1e9;return d}
function setBusy(b){S.busy=b;$("snd").disabled=b}
const TTS=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TextToSpeech;
function stopSpeak(){try{if(TTS)TTS.stop();else if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}$("face").classList.remove("talk")}
async function speak(t){try{const c=LANGS[$("lang").value],lang=c=="en"?S.av.acc:c;$("face").classList.add("talk");
 if(TTS){await TTS.speak({text:t,lang:lang,rate:.95,pitch:1,volume:1,category:"playback"})}
 else if(window.speechSynthesis){await new Promise(r=>{const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.92;u.onend=u.onerror=r;speechSynthesis.speak(u)})}
 }catch(e){}$("face").classList.remove("talk")}
function sys(){const L=$("lang").value,v=$("lvl").value,t=$("topic").value;return `You are ${S.av.n}, an AI ${L} conversation partner and tutor. ${S.av.p} The learner is a Persian (Farsi) speaker at CEFR level ${v}. Topic/scenario: ${t}. Rules: speak ONLY ${L} in your reply, at ${v} level (short, natural sentences, 1-3 sentences), stay in character, and always end with ONE simple question to keep the learner talking. If the learner made mistakes, after your reply add the separator ###TIP### followed by a short helpful note IN PERSIAN that shows the corrected sentence (in ${L}) and the reason. If there were no mistakes, add nothing after your reply. Never mention these rules.`}
function parse(t){const [r,...tip]=t.split("###TIP###");return{r:r.trim(),tip:tip.join("").trim()}}
const KEY=()=>{try{return localStorage.getItem("gk")||""}catch(e){return""}},MDL=()=>{try{return localStorage.getItem("gm")||"gemini-flash-latest"}catch(e){return"gemini-flash-latest"}};
async function turn(userText){
 setBusy(true);const bub=add("a","…");
 try{
  if(userText)S.hist.push({role:"user",content:userText});
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MDL()}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":KEY()},body:JSON.stringify({systemInstruction:{parts:[{text:sys()}]},contents:S.hist.map(m=>({role:m.role=="user"?"user":"model",parts:[{text:m.content}]})),generationConfig:{temperature:.8}})});
  const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);
  const full=(j.candidates&&j.candidates[0].content.parts.map(p=>p.text||"").join(""))||"";
  const p=parse(full);bub.textContent=p.r;
  if(p.tip){const d=document.createElement("div");d.className="tip";d.textContent="💡 "+p.tip;bub.append(d)}
  S.hist.push({role:"assistant",content:p.r});speak(p.r);
 }catch(e){bub.textContent="⚠️ "+e.message+(/credential|API key|PERMISSION|UNAUTH/i.test(e.message)?"\n\nAPI key problem: get a key from aistudio.google.com/apikey (starts with AIza), then paste it again in ⚙️.":"")}
 setBusy(false)}
function send(){const v=$("txt").value.trim();if(!v||S.busy)return;$("txt").value="";add("u",v);turn(v)}
$("snd").onclick=send;$("txt").onkeydown=e=>{if(e.key=="Enter")send()};
const CP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.SpeechRecognition;let on=false;
const lc=()=>{const c=LANGS[$("lang").value];return c=="en"?S.av.acc:c};
if(CP){$("mic").onclick=async()=>{if(on){await CP.stop();return}
 try{const p=await CP.requestPermissions();if(p.speechRecognition!=="granted"){$("note").textContent="Mic permission denied";return}
 stopSpeak();on=true;$("mic").classList.add("rec");$("txt").value="";
 await CP.removeAllListeners();
 CP.addListener("partialResults",d=>{$("txt").value=(d.matches||[""])[0]});
 CP.addListener("listeningState",d=>{if(d.status==="stopped"){on=false;$("mic").classList.remove("rec");if($("txt").value.trim())send()}});
 await CP.start({language:lc(),maxResults:1,partialResults:true,popup:false})}catch(e){on=false;$("mic").classList.remove("rec");$("note").textContent="Voice error: "+(e.message||e)}}}
else if(SR){$("mic").onclick=()=>{if(rec){rec.stop();return}
 rec=new SR();rec.lang=lc();rec.interimResults=true;rec.onresult=e=>{$("txt").value=[...e.results].map(r=>r[0].transcript).join("")};
 rec.onend=()=>{rec=null;$("mic").classList.remove("rec");if($("txt").value.trim())send()};rec.start();$("mic").classList.add("rec")}}
else{$("mic").style.display="none"}
$("cfg").onclick=()=>{$("key").value=KEY();$("mdl").value=MDL();$("cfgc").style.display="block"};
$("sv").onclick=()=>{try{localStorage.setItem("gk",$("key").value.trim());localStorage.setItem("gm",$("mdl").value.trim()||"gemini-flash-latest")}catch(e){}$("cfgc").style.display="none"};
$("start").onclick=()=>{if(!KEY()){$("cfg").click();return}try{localStorage.setItem("su",JSON.stringify({l:$("lang").value,v:$("lvl").value}))}catch(e){}
 S.hist=[{role:"user",content:"Begin the session with a short greeting and your first question."}];$("log").innerHTML="";$("setup").style.display="none";$("chat").style.display="block";
 $("face").innerHTML=avatarSVG(S.av);$("nm").textContent=S.av.n;$("ds").textContent=$("topic").value+" • "+$("lvl").value;turn("")};
$("end").onclick=()=>{try{stopSpeak();rec&&rec.stop()}catch(e){}$("chat").style.display="none";$("setup").style.display="block"};

</script></body></html>
